name: Build

# Builds both firmware variants on every push to main (docs-only changes are
# ignored) and replaces the single rolling "firmware" release (older releases are deleted), or can be run
# manually via workflow_dispatch.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "notebook/**"
      - "imgs/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1

    strategy:
      matrix:
        include:
          - variant: standard
            build_dir: build
            sdkconfig_defaults: sdkconfig.defaults
          - variant: secure-boot
            build_dir: build-secure
            sdkconfig_defaults: "sdkconfig.defaults;sdkconfig.secure"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          SHORT_SHA=$(git rev-parse --short HEAD)
          export PROJECT_VER_OVERRIDE="${SHORT_SHA}-${{ matrix.variant }}"
          idf.py -B "${{ matrix.build_dir }}" \
            -D "SDKCONFIG=${{ matrix.build_dir }}/sdkconfig" \
            -D "SDKCONFIG_DEFAULTS=${{ matrix.sdkconfig_defaults }}" \
            build

      - name: App size gate
        shell: bash
        run: .github/scripts/check_app_size.sh "${{ matrix.build_dir }}/web_server.bin"

      - name: Build merged factory image (standard variant only)
        if: matrix.variant == 'standard'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          # Explicit offsets (bootloader/partition-table/ota_data/app), not
          # `@flash_args`: that file embeds its own --flash_size (usually
          # "detect"), which conflicts with the --flash_size 4MB below that
          # a fresh, blank board needs.
          esptool.py --chip esp32c3 merge_bin \
            -o "${{ matrix.build_dir }}/factory-standard.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 "${{ matrix.build_dir }}/bootloader/bootloader.bin" \
            0xd000 "${{ matrix.build_dir }}/partition_table/partition-table.bin" \
            0x12000 "${{ matrix.build_dir }}/ota_data_initial.bin" \
            0x20000 "${{ matrix.build_dir }}/web_server.bin"

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.build_dir }}/web_server.bin" "out/app-${{ matrix.variant }}.bin"
          if [ -f "${{ matrix.build_dir }}/factory-standard.bin" ]; then
            cp "${{ matrix.build_dir }}/factory-standard.bin" out/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}-${{ github.sha }}
          path: out/

  host-tests:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and run host tests (linux target)
        shell: bash
        working-directory: test/host
        run: |
          . /opt/esp/idf/export.sh
          idf.py --preview set-target linux
          idf.py build
          ./build/host_tests.elf

  release:
    needs: [build, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          mkdir -p release
          cp artifacts/firmware-standard-${{ github.sha }}/app-standard.bin release/
          cp artifacts/firmware-standard-${{ github.sha }}/factory-standard.bin release/
          cp artifacts/firmware-secure-boot-${{ github.sha }}/app-secure-boot.bin release/
          ls -la release/

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=firmware" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > release/RELEASE_BODY.md <<EOF
          ## Firmware assets

          | File | Who it's for |
          | --- | --- |
          | \`app-standard.bin\` | Standard boards - OTA update via \`/ota\`, one file |
          | \`factory-standard.bin\` | Standard boards - full flash at offset \`0x0\` on a fresh/blank board over USB |
          | \`app-secure-boot.bin\` | **Maintainer's secure-boot board ONLY** |

          > **Warning:** \`app-secure-boot.bin\` is signed for the maintainer's one
          > Secure Boot V2 (RSA) fused board. Do **not** flash it on a standard
          > board: a standard board that receives a secure-boot bootloader/image
          > will burn its own verification eFuses and from then on only accept
          > images signed with this project's secure boot key, permanently. If
          > you are not that board, use \`app-standard.bin\` / \`factory-standard.bin\`.

          The web UI is embedded in the app image, so OTA is a single file.

          ## Flashing a fresh standard board

          1. Flash \`factory-standard.bin\` at offset \`0x0\` only (contains bootloader + partition table + ota_data_initial + app), e.g.:
             \`esptool.py --chip esp32c3 write_flash 0x0 factory-standard.bin\`

          ## Updating an already-flashed standard board (OTA)

          1. Join the Wi-Fi network \`ESP32_PLOT\` (no password).
          2. Open \`http://192.168.4.1/ota\` in a browser.
          3. Upload \`app-standard.bin\`.

          ---
          EOF

      # Keep exactly one release: drop the previous rolling release and its
      # tag so the new one is created fresh on this commit.
      - name: Delete previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete firmware --cleanup-tag --yes --repo "${{ github.repository }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Firmware ${{ steps.version.outputs.short_sha }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body_path: release/RELEASE_BODY.md
          files: |
            release/app-standard.bin
            release/factory-standard.bin
            release/app-secure-boot.bin
