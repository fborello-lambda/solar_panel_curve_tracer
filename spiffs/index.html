<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SolarPanel-Measurements</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.90em%22 font-size=%2290%22>%F0%9F%8C%9E</text></svg>">
  <style>
    :root {
      --bg: #fcfcfb;
      --card: #fcfcfb;
      --border: #e4e4e7;
      --fg: #171717;
      --muted: #71717a;
      --primary-bg: #262626;
      --primary-fg: #fafafa;
      --secondary-bg: #f4f4f5;
      --secondary-fg: #262626;
      --destructive: #dc2626;
      --radius: 0.625rem;
      --chart-i: #D97706;
      --chart-p: #7C3AED;
      --chart-mpp: #0891B2;
      --chart-grid: #e4e4e7;
      --chart-tick: #71717a;
      --focus: #0891B2;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0f1a;
        --card: #11141f;
        --border: rgba(255, 255, 255, 0.10);
        --fg: #f1f3f9;
        --muted: #c7ccd6;
        --primary-bg: #e5e5e5;
        --primary-fg: #262626;
        --secondary-bg: #2a2d36;
        --secondary-fg: #fafafa;
        --destructive: #f87171;
        --chart-grid: rgba(255, 255, 255, 0.12);
        --chart-tick: #c7ccd6;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b0f1a;
      --card: #11141f;
      --border: rgba(255, 255, 255, 0.10);
      --fg: #f1f3f9;
      --muted: #c7ccd6;
      --primary-bg: #e5e5e5;
      --primary-fg: #262626;
      --secondary-bg: #2a2d36;
      --secondary-fg: #fafafa;
      --destructive: #f87171;
      --chart-grid: rgba(255, 255, 255, 0.12);
      --chart-tick: #c7ccd6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
    }

    .starfield {
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255, 255, 255, 0.35), transparent),
        radial-gradient(1px 1px at 80% 15%, rgba(255, 255, 255, 0.25), transparent),
        radial-gradient(1px 1px at 60% 70%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 30% 85%, rgba(255, 255, 255, 0.2), transparent),
        radial-gradient(1px 1px at 90% 60%, rgba(255, 255, 255, 0.25), transparent);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    #wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 16px 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 0;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.15rem;
      margin: 0;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--secondary-bg);
      color: var(--secondary-fg);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
    }

    .pill[data-state="measuring"] .pill-dot {
      background: var(--chart-i);
    }

    .pill[data-state="error"] .pill-dot {
      background: var(--destructive);
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--secondary-bg);
      color: var(--secondary-fg);
      cursor: pointer;
      flex: none;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 16px;
    }

    #chartBox {
      height: min(60vh, 460px);
      min-height: 260px;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      min-height: 44px;
      padding: 10px 18px;
      transition: opacity 120ms ease;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--primary-bg);
      color: var(--primary-fg);
      flex: 1 1 auto;
      font-weight: 600;
    }

    .btn-secondary {
      background: var(--secondary-bg);
      color: var(--secondary-fg);
      border-color: var(--border);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 480px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 760px) {
      .stats {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    footer a {
      color: inherit;
    }

    #errBanner {
      display: none;
      background: var(--destructive);
      color: #fff;
      border-radius: var(--radius);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <header>
      <h1>Solar Panel I-V Curve</h1>
      <div class="header-right">
        <span id="statusPill" class="pill" data-state="idle" role="status" aria-live="polite">
          <span class="pill-dot"></span>
          <span id="statusText">Idle</span>
        </span>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4">
            </path>
          </svg>
        </button>
      </div>
    </header>

    <div id="errBanner" role="alert"></div>

    <div class="card">
      <div id="chartBox">
        <canvas id="chartCanvas"></canvas>
      </div>
    </div>

    <div class="actions">
      <button id="startMeasBtn" class="btn-primary" type="button">Start measurement</button>
      <button id="downloadCsvBtn" class="btn-secondary" type="button">Download CSV</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Voc</div>
        <div id="voc" class="stat-value">-- V</div>
      </div>
      <div class="stat">
        <div class="stat-label">Isc</div>
        <div id="isc" class="stat-value">-- mA</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pmax</div>
        <div id="pmax" class="stat-value">-- mW</div>
      </div>
      <div class="stat">
        <div class="stat-label">Vmp</div>
        <div id="mpptVoltage" class="stat-value">-- V</div>
      </div>
      <div class="stat">
        <div class="stat-label">Imp</div>
        <div id="mpptCurrent" class="stat-value">-- mA</div>
      </div>
      <div class="stat">
        <div class="stat-label">Points</div>
        <div id="info" class="stat-value">0</div>
      </div>
    </div>

    <footer>
      <a href="/ota">Firmware update</a> &middot; <span id="fwVersion">v--</span>
    </footer>
  </div>

  <script src="/chart.js"></script>
  <script src="/script.js"></script>
</body>

</html>
